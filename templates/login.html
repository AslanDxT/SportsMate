<!-- login.html -->
{% extends "base.html" %}

{% block title %}Login - SportsMate{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="eyebrow">WELCOME BACK</span>
            <h1>Login to SportsMate</h1>
            <p>Find your next activity.</p>
        </div>

        <form method="POST" class="form">
            <label>Email
                <input type="email" name="email" placeholder="you@example.com" required>
            </label>

            <label>Password
                <div class="password-field">
                    <input type="password" name="password" id="password" required>
                    <button type="button" onclick="togglePassword('password')">Show</button>
                </div>
            </label>

            <button type="submit" class="btn full-width" style="margin-top: 10px;">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
