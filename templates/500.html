<!-- 500.html -->
{% extends "base.html" %}

{% block title %}
Server Error - SportsMate
{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-number">
        500
    </div>

    <h1>
        System Fault

    <p>
        Our servers encountered an unexpected interference. 
    </p>

    <a
        href="{{ url_for('index') }}"
        class="btn"
    >
        Return to Base
    </a>

</div>

{% endblock %}
