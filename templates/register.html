{% extends "base.html" %}

{% block title %}Create Account - SportsMate{% endblock %}

{% block content %}
<div class="auth-page auth-register-bg">
    <div class="auth-card wide">
        <div class="auth-header">
            <span class="eyebrow">JOIN THE COMMUNITY</span>
            <h1>Create your account</h1>
            <p>Set up your athlete profile.</p>
        </div>

        <form method="POST" class="form">
            <label>Name
                <input type="text" name="name" placeholder="Your name" required>
            </label>

            <label>Email
                <input type="email" name="email" placeholder="you@example.com" required>
            </label>

            <div class="form-row">
                <label>Password
                    <input type="password" name="password" required>
                </label>
                <label>Confirm password
                    <input type="password" name="confirm_password" required>
                </label>
            </div>

            <label>Location
                <input type="text" name="location" placeholder="e.g. Den Bosch">
            </label>

            <div class="form-row">
                <label>Skill level
                    <select name="skill_level">
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </label>
                <label>Favourite sport
                    <select name="sport_id">
                        <option value="">Choose a sport</option>
                        {% for sport in sports %}
                        <option value="{{ sport.id }}">{{ sport.name }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>

            <button type="submit" class="btn full-width" style="margin-top: 10px;">Initialize Profile</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
