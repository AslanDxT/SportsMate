<!-- create_activity.html -->
{% extends "base.html" %}

{% block title %}Create Activity - SportsMate{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div>
            <span class="eyebrow">CREATE</span>
            <h1>Create Activity</h1>
            <p>Launch your next sports session and build the roster.</p>
        </div>
    </div>

    <form method="POST" class="form form-card">
        <label>Activity title
            <input type="text" name="title" placeholder="e.g. Midnight Streetball" required>
        </label>

        <label>Sport
            <select name="sport_id" required>
                <option value="">Select a sport</option>
                {% for sport in sports %}
                <option value="{{ sport.id }}">{{ sport.name }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Description
            <textarea name="description" rows="5" placeholder="Outline the session rules, intensity, and vibe..."></textarea>
        </label>

        <div class="form-row">
            <label>Date
                <input type="date" name="date" required>
            </label>
            <label>Time
                <input type="time" name="time" required>
            </label>
        </div>

        <label>Location
            <input type="text" name="location" placeholder="e.g. Downtown Arena" required>
        </label>

        <div class="form-row">
            <label>Skill level
                <select name="skill_level">
                    <option>Beginner</option>
                    <option>Intermediate</option>
                    <option>Advanced</option>
                </select>
            </label>
            <label>Maximum participants
                <input type="number" name="max_participants" value="10" min="2" max="100" required>
            </label>
        </div>

        <button type="submit" class="btn full-width" style="margin-top: 10px;">
            <svg class="app-icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Initialize Session
        </button>
    </form>
</div>
{% endblock %}
