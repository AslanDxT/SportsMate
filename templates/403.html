<!-- 403.html -->
{% extends "base.html" %}

{% block title %}
Access Denied - SportsMate
{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-number">
        403
    </div>

    <h1>
        Access Denied
    </h1>

    <p>
        You do not have the required clearance for this zone.
    </p>

    <a
        href="{{ url_for('index') }}"
        class="btn"
    >
        Return to Base
    </a>

</div>

{% endblock %}
