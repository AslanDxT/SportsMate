<!-- edit_profile.html -->
{% extends "base.html" %}

{% block title %}Edit Profile - SportsMate{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div>
            <span class="eyebrow">PROFILE</span>
            <h1>Edit your profile</h1>
        </div>
    </div>

    <form method="POST" class="form form-card">
        <label>Name
            <input type="text" name="name" value="{{ user.name }}" required>
        </label>

        <label>Location
            <input type="text" name="location" value="{{ user.location }}">
        </label>

        <label>Bio
            <textarea name="bio" rows="5">{{ user.bio }}</textarea>
        </label>

        <label>Skill level
            <select name="skill_level">
                <option {% if user.skill_level == "Beginner" %}selected{% endif %}>Beginner</option>
                <option {% if user.skill_level == "Intermediate" %}selected{% endif %}>Intermediate</option>
                <option {% if user.skill_level == "Advanced" %}selected{% endif %}>Advanced</option>
            </select>
        </label>

        <label>Availability
            <input type="text" name="availability" value="{{ user.availability }}" placeholder="e.g. evenings and weekends">
        </label>

        <fieldset>
            <legend>Sports you enjoy</legend>
            <div class="checkbox-grid">
                {% for sport in sports %}
                <label class="checkbox-label">
                    <input type="checkbox" name="sports" value="{{ sport.id }}" {% if sport.id in selected_ids %}checked{% endif %}>
                    {{ sport.name }}
                </label>
                {% endfor %}
            </div>
        </fieldset>

        <button type="submit" class="btn" style="margin-top: 15px;">
            <svg class="app-icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
